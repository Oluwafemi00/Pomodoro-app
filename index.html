<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus — Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="logo">
        <div class="logo-dot"></div>
        Focus <em>&nbsp;Timer</em>
      </div>
      <div class="topbar-right">
        <button
          class="btn-icon"
          id="volume-btn"
          title="Toggle sound"
          aria-label="Toggle sound"
        >
          <svg id="vol-icon" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
        </button>
      </div>
    </div>

    <div class="page">
      <!-- TIMER CARD -->
      <div class="timer-card" id="timer-section">
        <div class="mode-pill" id="mode-pill">
          <span class="mode-pill-dot"></span>
          <span id="mode-pill-text">Ready</span>
        </div>

        <div class="ring-container">
          <svg class="ring-svg" width="200" height="200" viewBox="0 0 200 200">
            <circle class="ring-track" cx="100" cy="100" r="85" />
            <circle class="ring-fill" id="ring-fill" cx="100" cy="100" r="85" />
          </svg>
          <div class="ring-center">
            <div class="timer-display" id="timer-display">25:00</div>
            <div class="timer-session-sub" id="session-sub"></div>
          </div>
        </div>

        <p class="task-label" id="task-label">
          Add a task below to get started
        </p>

        <div class="timer-controls">
          <button class="btn-timer primary" id="start-btn" disabled>
            <svg viewBox="0 0 24 24">
              <polygon
                points="5 3 19 12 5 21 5 3"
                fill="currentColor"
                stroke="none"
              />
            </svg>
            Start
          </button>
          <button class="btn-timer" id="pause-btn" disabled>
            <svg viewBox="0 0 24 24">
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
            Pause
          </button>
          <button class="btn-timer" id="reset-btn" disabled>
            <svg viewBox="0 0 24 24">
              <polyline points="1 4 1 10 7 10" />
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
            </svg>
            Reset
          </button>
        </div>
        <p class="kb-hint" style="margin-top: 12px">
          <kbd>Space</kbd> start/pause &nbsp;·&nbsp; <kbd>Esc</kbd> reset
        </p>
      </div>

      <!-- ADD TASK -->
      <div class="add-card">
        <p class="add-card-title">New Task</p>
        <div class="input-row">
          <div class="field task-name-field">
            <label>Task name</label>
            <input
              type="text"
              id="task-input"
              placeholder="e.g. Read research paper…"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label>Focus</label>
            <input type="number" id="time-input" value="25" min="1" />
          </div>
          <div class="field">
            <label>Break</label>
            <input type="number" id="break-input" value="5" min="1" />
          </div>
          <div class="field">
            <label>Rounds</label>
            <input type="number" id="sessions-input" value="2" min="1" />
          </div>
        </div>
        <button class="btn-add" id="add-task-btn">Add Task</button>
      </div>

      <!-- TASK LIST -->
      <div class="tasks-card">
        <div class="tasks-head">
          <span class="tasks-title">Tasks</span>
          <span class="tasks-count" id="tasks-count">0 tasks</span>
        </div>
        <ul class="task-list" id="task-list"></ul>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box">
        <span class="modal-icon" id="modal-icon">🎯</span>
        <h3 class="modal-title" id="modal-title">Title</h3>
        <p class="modal-msg" id="modal-msg">Message</p>
        <button class="modal-btn" id="modal-btn">Continue</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
